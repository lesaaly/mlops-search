apiVersion: v1
kind: Service
metadata:
  name: {{ include "mlops-search.name" . }}
  labels:
    {{- include "mlops-search.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: mlops-search
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http

