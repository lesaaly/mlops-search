apiVersion: v1
kind: Pod
metadata:
  name: "{{ include "mlops-search.name" . }}-test"
  labels:
    {{- include "mlops-search.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": test
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  restartPolicy: Never
  containers:
    - name: curl
      image: curlimages/curl:8.15.0
      args: ["--fail", "--silent", "--show-error", "--retry", "12", "--retry-delay", "5", "--retry-connrefused", "http://{{ include "mlops-search.name" . }}:{{ .Values.service.port }}/readyz"]
      resources:
        requests:
          cpu: 10m
          memory: 16Mi
        limits:
          cpu: 50m
          memory: 32Mi
